# 每日精选表情包：北京时间每天 04:00 执行一次。
# 工作流只读取 stickers-upload-links.md 中已有的图床链接，不上传、不删除任何文件。
# 每次从 9 个系列中随机选 5 个，每个系列随机选 10 条，生成 50 条精选 JSON。
# 所有链接始终保留在 stickers-upload-links.md 中。
name: Daily featured stickers manifest

on:
  schedule:
    - cron: '0 20 * * *'   # UTC 20:00 = 北京时间 04:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-featured:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate featured manifests and report results
        env:
          RANDOM_FOLDERS: '5'
          RANDOM_PER_FOLDER: '10'
        run: |
          python - <<'PY'
          import json
          import os
          import random
          import re
          import sys
          from pathlib import Path

          LINKS_FILE = Path("stickers-upload-links.md")
          MANIFESTS = (Path("owo.json"), Path("owo-cfbed.json"))
          FOLDER_ORDER = [
              ("blobcat", "可爱猫"), ("bilibili", "小电视"), ("catbug", "猫猫虫"),
              ("heybox", "方块脸"), ("Arknights", "明日方舟"), ("GuduYaoGun", "孤独摇滚"),
              ("KaLaBiQiu", "卡拉彼丘"), ("QianLianWanHua", "千恋万花"), ("Taffy", "塔菲"),
          ]
          FOLDER_NAMES = {folder for folder, _category in FOLDER_ORDER}
          LINK_RE = re.compile(r"^- \[([^\]]+)\]\((https?://[^)]+)\)\s*$")
          HEADING_RE = re.compile(r"^##\s+(.+?)\s*$")
          NUM_FOLDERS = int(os.environ.get("RANDOM_FOLDERS") or "5")
          PER_FOLDER = int(os.environ.get("RANDOM_PER_FOLDER") or "10")


          def write_json(path, data):
              text = json.dumps(data, ensure_ascii=False, indent="\t")
              path.write_text(text + "\n", encoding="utf-8", newline="")


          def load_links():
              if not LINKS_FILE.is_file():
                  raise RuntimeError(f"Missing source file: {LINKS_FILE}")

              groups = {folder: [] for folder in FOLDER_NAMES}
              current_folder = None
              for raw_line in LINKS_FILE.read_text(encoding="utf-8").splitlines():
                  heading = HEADING_RE.match(raw_line.strip())
                  if heading:
                      current_folder = heading.group(1).strip()
                      if current_folder not in FOLDER_NAMES:
                          current_folder = None
                      continue

                  match = LINK_RE.match(raw_line.strip())
                  if match and current_folder:
                      filename, url = match.groups()
                      groups[current_folder].append({"filename": filename, "url": url})

              return groups


          def build_manifest(selected):
              manifest = {}
              for folder, category in FOLDER_ORDER:
                  entries = [entry for selected_folder, entry in selected
                             if selected_folder == folder]
                  if not entries:
                      continue
                  manifest[category] = {
                      "type": "image",
                      "container": [
                          {
                              "text": Path(entry["filename"]).stem,
                              "icon": f"<img src='{entry['url']}'>",
                          }
                          for entry in entries
                      ],
                  }
              return manifest


          try:
              groups = load_links()
              available = [folder for folder, _category in FOLDER_ORDER if groups[folder]]
              if len(available) < NUM_FOLDERS:
                  raise RuntimeError(
                      f"Need at least {NUM_FOLDERS} non-empty folders, found {len(available)}"
                  )

              chosen = random.sample(available, NUM_FOLDERS)
              selected = []
              for folder in chosen:
                  entries = groups[folder]
                  if len(entries) < PER_FOLDER:
                      raise RuntimeError(
                          f"Folder {folder} has {len(entries)} links; "
                          f"need at least {PER_FOLDER}"
                      )
                  selected.extend((folder, entry) for entry in random.sample(entries, PER_FOLDER))

              random.shuffle(selected)
              manifest = build_manifest(selected)
              for output in MANIFESTS:
                  write_json(output, manifest)

              counts = {folder: sum(1 for selected_folder, _entry in selected
                                    if selected_folder == folder) for folder in chosen}
              print(f"source: {LINKS_FILE} ({sum(map(len, groups.values()))} links)")
              print(f"featured: {len(selected)} links from {len(chosen)} folders")
              for folder in chosen:
                  print(f"  {folder}: {counts[folder]}")

              print("featured links:")
              for folder, entry in selected:
                  print(f"  {folder}/{entry['filename']} -> {entry['url']}")

              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as summary:
                      summary.write("## 每日精选表情包\n\n")
                      summary.write(f"- 来源：`{LINKS_FILE}`\n")
                      summary.write(f"- 全部链接：{sum(map(len, groups.values()))}\n")
                      summary.write(f"- 本次精选：{len(selected)}\n")
                      summary.write(f"- 随机系列：{len(chosen)}\n")
                      summary.write("- 上传操作：无\n")
                      summary.write("- 删除操作：无\n")
                      summary.write("\n## 本次精选链接\n\n")
                      for folder, _category in FOLDER_ORDER:
                          entries = [entry for selected_folder, entry in selected
                                     if selected_folder == folder]
                          if not entries:
                              continue
                          summary.write(f"### {folder}\n\n")
                          for entry in entries:
                              summary.write(f"- [{entry['filename']}]({entry['url']})\n")
                          summary.write("\n")
          except (OSError, ValueError, RuntimeError) as error:
              print(f"ERROR: {error}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Commit and push featured manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owo.json owo-cfbed.json
          git diff --cached --quiet && echo "no changes to commit" || git commit -m "chore: refresh featured stickers [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push
